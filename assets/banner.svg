    <style>
.sans{font-family:'Bricolage Grotesque','Geist','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'Geist Mono','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
